[project]
name = "auto-annotation-system"
version = "0.1.0"
description = "One-Click Auto Annotation System (SAM 2 + GroundingDINO) for drone imagery"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pep8-naming, pyupgrade, bugbear
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["core", "utils", "app"]
