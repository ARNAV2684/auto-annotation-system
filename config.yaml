# ──────────────────────────────────────────────────────────────────────────
# Auto Annotation System — central configuration
# No hardcoded paths/thresholds in code: everything tunable lives here.
# Paths are relative to the repo root unless absolute.
# ──────────────────────────────────────────────────────────────────────────

paths:
  models_dir: models/sam_checkpoints
  data_dir: data
  sample_images: data/sample_images
  sample_annotations: data/sample_annotations
  output_dir: outputs
  # Writable, app-managed copy of the project list. Seeded from the `projects`
  # block below on first run, then mutated at runtime when the user creates a
  # group or registers a custom class. Gitignored (lives under outputs/).
  projects_store: outputs/projects.json

# ─── SAM 2 ───
sam:
  # Variant: "hiera_s" (fast, dev) or "hiera_b_plus" (more accurate). Fits 8 GB GPU.
  variant: hiera_s
  checkpoint: models/sam_checkpoints/sam2.1_hiera_small.pt
  model_cfg: configs/sam2.1/sam2.1_hiera_s.yaml
  device: auto            # auto | cuda | cpu
  # SamAutomaticMaskGenerator tuning (Stage 4 of the brief pipeline)
  auto:
    points_per_side: 32
    pred_iou_thresh: 0.85
    stability_score_thresh: 0.92
    min_mask_region_area: 100

# ─── Preprocessing (ported from latest/tree_counter.py) ───
preprocess:
  target_size: 1024       # SAM optimal longest-edge
  clahe_clip_limit: 2.0
  clahe_tile_size: 8
  sharpen_strength: 0.3

# ─── Mask post-processing ───
mask:
  min_area: 100           # drop noise masks below this pixel area
  nms_iou_threshold: 0.5  # merge/dedupe overlapping masks
  polygon_epsilon: 2.0    # Douglas-Peucker simplification tolerance

# ─── Detection (GroundingDINO — Sprint 2) ───
grounding_dino:
  model_id: IDEA-Research/grounding-dino-base
  device: auto            # auto | cuda | cpu

detector:
  box_threshold: 0.20
  text_threshold: 0.20
  prompts:
    - tree
    - palm tree

# ─── Annotation projects (Sprint 6.x) ───
#
# A "project" is a UI preset: a named set of class labels plus default detection
# prompts tuned for one kind of work (vegetation survey, road defects, etc.).
# Switching project in the UI changes which labels the dropdowns offer and what
# text fills the auto-detect box -- nothing about the data layer changes.
#
# Adding a new project = adding a YAML block here. No backend code changes needed.
projects:
  - id: vegetation
    label: Vegetation
    classes: [tree, palm_tree, shrub]
    default_prompts: [tree, palm tree]
  # Classes mirror the trained road-defects model's data.yaml names exactly
  # (see `training:` below) so model output needs no label translation.
  # `ravelling` is omitted from default_prompts: those feed GroundingDINO,
  # which doesn't know the term — the trained model covers it instead.
  - id: road_defects
    label: Road Defects
    classes: [cracks, potholes, ravelling]
    default_prompts: [potholes, cracks]
  - id: infrastructure
    label: Infrastructure
    classes: [bridge, traffic_sign, light_pole, electric_pole, building]
    default_prompts: [traffic sign, light pole, bridge]

# Legacy: the flat ``classes`` key is kept as a fallback so older tests / scripts
# (and a senior pulling an older config) keep working. The first project's
# classes are taken when ``projects`` is empty.
classes:
  - tree
  - palm_tree
  - shrub

# ─── Annotation export (Sprint 3) ───
yolo:
  mode: segmentation        # segmentation (polygons) | detection (boxes only)

coco:
  # Classes listed here are exported as RLE with iscrowd=1 — for dense, overlapping
  # objects (e.g. tangled vegetation) where a single polygon would lie. Others use
  # polygon segmentation with iscrowd=0. A human may override per-object in the UI.
  crowd_classes: []         # e.g. [vegetation, forest, dense_canopy]
  supercategory: object     # COCO category supercategory label

voc:
  database: GarudaUAV       # written into the <source><database> tag

export:
  zip: true                 # also produce exports.zip alongside the per-format folders

# ─── Trained models (Sprint 7) ───
# Projects listed here run auto-detect through their own fine-tuned YOLOv8-seg
# checkpoint instead of GroundingDINO + SAM. The ``weights`` path holds the
# *deployed* (blessed) weights — promotion into it is gated on eval metrics.
# If the file is missing, the project silently falls back to Grounded-SAM.
trained_models:
  road_defects:
    weights: models/road_defects/deployed.pt
    conf_threshold: 0.25
    imgsz: 640

# ─── Custom training (Sprint 7) ───
# Offline YOLOv8-seg fine-tuning on labelled drone data. Run with:
#   pip install -r requirements-train.txt
#   python -m training.data_prep road_defects
#   python -m training.train_road road_defects
#   python -m training.evaluate road_defects
# Only the road-defects track has labelled data today; the same block shape
# supports more tracks later (just add another entry).
training:
  road_defects:
    dataset_src: data/cracks_potholes_ravelling   # labelled source (images/ + labels/ + data.yaml)
    work_dir: data/road_defects_yolo              # generated train-ready split (gitignored)
    base_model: yolov8n-seg.pt                    # pretrained base to fine-tune
    epochs: 100
    imgsz: 640
    batch: 8
    split: [0.8, 0.1, 0.1]                        # train / val / test
    seed: 42
    output_dir: models/road_defects               # where runs + weights land (gitignored)
