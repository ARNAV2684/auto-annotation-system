# Serves the built SPA and forwards API calls to the backend container.
# "backend" resolves via Docker's internal DNS to the compose service name —
# the production equivalent of Vite's dev-server proxy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Drone images and zip archives are large; nginx's 1 MB default would
    # reject uploads before they ever reach FastAPI.
    client_max_body_size 500m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Resolve "backend" per request via Docker's embedded DNS instead of
        # at startup — otherwise nginx refuses to boot whenever the backend
        # container isn't up yet (and couldn't survive its restarts).
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # First-time inference on a big image can exceed the 60 s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite emits content-hashed assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any other path is client-side routing -> index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
