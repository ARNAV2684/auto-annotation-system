name: CI

# Runs on every pull request into develop/main and on direct pushes to them.
# GitHub's runners have no GPU, so this runs only the fast, GPU-free checks
# (ruff lint + GPU-free unit tests). The SAM-on-GPU smoke test is a local check.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  lint-and-test:
    name: Lint & test (GPU-free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with pytest
        run: pytest --cov --cov-report=term-missing
